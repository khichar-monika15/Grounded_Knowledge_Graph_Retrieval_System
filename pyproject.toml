[project]
name = "layer10-assign"
version = "0.1.0"
description = "Grounded long-term memory system for Enron email dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.2",
    "sentence-transformers>=2.2.0",
    "streamlit>=1.30.0",
    "streamlit-agraph>=0.0.45",
    "python-dateutil>=2.8.0",
    "scikit-learn>=1.3.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "pyvis>=0.3.0",
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "litellm>=1.82.0",
    "faiss-cpu>=1.13.2",
    "rank-bm25>=0.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
